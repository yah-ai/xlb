# xlb is its own Cargo workspace — it lives under yah/external/ during early
# iteration but is intended to move to its own repo. yah's `.gitignore`
# excludes `external/`, so this tree carries independent git history.
[workspace]
members = ["crates/xlb", "crates/xlb-cli"]
resolver = "2"

[workspace.package]
version = "0.8.40"
edition = "2021"
authors = ["yah Dev <human@yah.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yah-ai/xlb"

# --- profiles: keep in lockstep with the yah monorepo root Cargo.toml ---
#
# `exclude = ["oss", "external"]` in the root makes this a genuine separate
# workspace, so it inherits NOTHING from it — until 2026-09-12 everything here
# built at cargo's defaults (`debug = true`, `opt-level = 0`) for the entire
# dependency graph. Two reasons that was wrong:
#
#   Disk. Full DWARF on every dependency is what made `oss/yubaba/target` 16G
#   and `oss/cheers/target` 11G, nearly all of it debuginfo nobody reads in
#   this camp. `line-tables-only` keeps the part that IS consumed — file:line
#   backtraces and panic locations — and drops the type/variable DWARF.
#
#   sccache. Its cache key includes rustc flags, so one dependency compiled at
#   `debug = true` here and `debug = false` from the root is two entries for
#   one crate, and every cross-workspace hit was silently lost.
#
# Changing these invalidates every prior artifact and sccache entry for this
# workspace (different flags -> different hashes); that was the point. If you
# need to single-step a dependency, override it per-package locally rather
# than reverting the `"*"` glob.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1
# W308/R745-T1: `-C incremental` makes sccache refuse a crate outright. This
# glob applies to DEPENDENCIES and never to workspace members, so crates you
# edit here keep incremental and crates you merely consume become cacheable.
incremental = false
